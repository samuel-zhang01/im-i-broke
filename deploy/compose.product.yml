# Standalone image-only distribution. Never combine with existing home overlays.
name: ${FINANCE_INSTANCE_ID:?Set a unique FINANCE_INSTANCE_ID for this household}

x-runtime: &runtime
  image: ${FINANCE_BACKEND_IMAGE:?Set a reviewed versioned backend image}
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777"]
  pids_limit: 96
  mem_limit: 1g
  cpus: 2
  logging:
    driver: json-file
    options: {max-size: "5m", max-file: "3"}
  environment: &environment
    FINANCE_INSTANCE_ID: ${FINANCE_INSTANCE_ID:?Set a unique FINANCE_INSTANCE_ID for this household}
    FINANCE_DEPLOYMENT: ${FINANCE_DEPLOYMENT:-local}
    FINANCE_PUBLIC_ORIGIN: ${FINANCE_PUBLIC_ORIGIN:-}
    FINANCE_COOKIE_SECURE: ${FINANCE_COOKIE_SECURE:-true}
    FINANCE_AUTH_ENABLED: "true"
    FINANCE_DB_PATH: /app/data/finance.db
    FINANCE_AUTH_DB_PATH: /app/data/auth.db
    FINANCE_UPLOADS_PATH: /app/uploads
    FINANCE_AUTH_KEY_PATH: /app/keys/auth.key
    FINANCE_ALLOWED_HOSTS: ${FINANCE_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1],backend}

services:
  backend:
    <<: *runtime
    environment:
      <<: *environment
      LUNCH_FLOW_API: ${LUNCH_FLOW_API:-}
      LUNCH_FLOW_SYNC_SECONDS: ${LUNCH_FLOW_SYNC_SECONDS:-21600}
      SNAPTRADE_ID: ${SNAPTRADE_ID:-}
      SNAPTRADE_KEY: ${SNAPTRADE_KEY:-}
      SNAPTRADE_SYNC_SECONDS: ${SNAPTRADE_SYNC_SECONDS:-600}
      INVESTMENT_PRICE_REFRESH_SECONDS: ${INVESTMENT_PRICE_REFRESH_SECONDS:-900}
      LUNCH_FLOW_CLIENT_ID: ${LUNCH_FLOW_CLIENT_ID:-}
      LUNCH_FLOW_CLIENT_SECRET: ${LUNCH_FLOW_CLIENT_SECRET:-}
      SNAPTRADE_COMMERCIAL_ID: ${SNAPTRADE_COMMERCIAL_ID:-}
      SNAPTRADE_COMMERCIAL_KEY: ${SNAPTRADE_COMMERCIAL_KEY:-}
    volumes:
      - data:/app/data
      - uploads:/app/uploads
      - keys:/app/keys:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    image: ${FINANCE_FRONTEND_IMAGE:?Set a matching reviewed frontend image}
    depends_on:
      backend: {condition: service_healthy}
    ports: ["${FINANCE_BIND_ADDRESS:-127.0.0.1}:${FINANCE_PORT:-8080}:8080"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777"]
    pids_limit: 32
    mem_limit: 384m
    cpus: 1
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Only explicit offline administrator operations can write authentication keys.
  admin:
    <<: *runtime
    profiles: [maintenance]
    network_mode: none
    command: [python, -m, scripts.installation, init]
    volumes:
      - data:/app/data
      - uploads:/app/uploads
      - keys:/app/keys
      - backups:/app/backups
    restart: "no"

volumes:
  data:
  uploads:
  keys:
  backups:
