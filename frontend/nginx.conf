# Serves the built SPA and reverse-proxies /api to the backend container so the
# whole app is reachable from a single origin (no CORS needed in production).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 15s;
    limit_conn per_client 16;
    include /etc/nginx/security-headers.conf;
    include /etc/nginx/access-policy.conf;
    # Connected APIs only; no browser file uploads.
    client_max_body_size 1m;

    # Each release references new hashed assets; never retain an old SPA entry.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        # Preserve the SPA bytes: edge-injected scripts conflict with our strict CSP.
        add_header Cache-Control "no-store, no-transform" always;
    }

    # Public, versioned shortcut metadata; no financial data or offline cache.
    location ~ ^/assets/brand/[^/]+\.webmanifest$ {
        default_type application/manifest+json;
        expires 30d;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Long-cache the hashed asset bundles and versioned brand assets.
    location /assets/ {
        expires 30d;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API → FastAPI backend.
    location ~ ^/api/(auth/(login|recovery-codes)|setup/(begin|enroll))$ {
        limit_req zone=login burst=5 nodelay;
        client_max_body_size 4k;
        include /etc/nginx/api-proxy.conf;
    }

    location ~ ^/api/connections/authorization/(start|complete)$ {
        limit_req zone=login burst=5 nodelay;
        client_max_body_size 8k;
        include /etc/nginx/api-proxy.conf;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        client_max_body_size 1m;
        include /etc/nginx/api-proxy.conf;
    }

    # Dotfiles are never served from the public document root.
    location ~ /\. { return 404; }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
