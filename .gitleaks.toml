# Keep all upstream rules. The exact match below names encrypted example files;
# it contains no credential. Do not exclude documentation paths from scanning.
minVersion = "8.30.1"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Exact encrypted-backup filename example"
regexTarget = "match"
regexes = ['''^owner-key-2026-09-21\.age > owner-key-2026-09-21\.age$''']
